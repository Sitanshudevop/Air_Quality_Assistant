name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Code Quality Linting
        run: npm run lint

      - name: Client Typecheck
        run: npm run typecheck

      - name: API Serverless Typecheck
        run: npm run typecheck:api

      - name: Vitest Unit Tests & Strict Coverage
        run: npm run test:coverage

      - name: Production Bundle Build
        run: npm run build

      - name: Client Secret Leak Audit
        run: npm run check:no-client-secrets

      - name: Initial JS Bundle Budget Gate
        run: npm run check:bundle-budget

      - name: Knip Dead Code Audit
        run: npm run knip

      - name: jscpd Copy-Paste Detection
        run: npm run jscpd

      - name: madge Circular Dependency Audit
        run: npm run madge

      - name: Dependency Security Audit
        run: npm audit --audit-level=high
